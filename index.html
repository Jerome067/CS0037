<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPI Reviewer: Modules 4 and 5</title>
<style>
    :root {
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --primary-color: #6200ea;
        --primary-hover: #7c4dff;
        --text-color: #e0e0e0;
        --text-muted: #aaaaaa;
        --success: #1b5e20;
        --success-border: #2e7d32;
        --danger: #b71c1c;
        --danger-border: #c62828;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; line-height: 1.6; }
    h1, h2, h3 { text-align: center; color: #ffffff; }
    .container { max-width: 800px; margin: 0 auto; }

    .tabs, .modes { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    button { background: #333333; color: #ffffff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-size: 16px; transition: 0.3s; }
    button:hover { background: #444444; }
    button.active { background: var(--primary-color); font-weight: bold; box-shadow: 0 0 10px rgba(98, 0, 234, 0.5); }
    button.active:hover { background: var(--primary-hover); }

    .hidden { display: none !important; }
    .card-container, .quiz-container, .scoreboard { background: var(--surface-color); padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); border: 1px solid #333; min-height: 350px; display: flex; flex-direction: column; justify-content: center; }

    .flashcard-wrapper { perspective: 1000px; width: 100%; height: 280px; margin-bottom: 20px; }
    .flashcard { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; cursor: pointer; position: relative; }
    .flashcard.flip { transform: rotateY(180deg); }
    .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #252525; border-radius: 10px; padding: 20px; box-sizing: border-box; text-align: center; border: 2px solid #333; overflow-y: auto; }
    .face.back { transform: rotateY(180deg); background: #2a2a2a; border-color: var(--primary-color); }
    .fc-question { font-size: 1.3em; font-weight: bold; }
    .fc-answer { font-size: 1.4em; color: var(--primary-hover); font-weight: bold; margin-bottom: 10px; }
    .fc-explanation { font-size: 0.95em; color: var(--text-muted); }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }

    .quiz-question { font-size: 1.2em; font-weight: bold; margin-bottom: 20px; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option { background: #2c2c2c; padding: 15px; border-radius: 8px; cursor: pointer; border: 2px solid #444; transition: 0.2s; font-size: 1.05em; }
    .option:hover { background: #3c3c3c; }
    .option.correct { background: var(--success); border-color: var(--success-border); }
    .option.wrong { background: var(--danger); border-color: var(--danger-border); }
    .option.disabled { pointer-events: none; opacity: 0.8; }
    .explanation-box { margin-top: 20px; padding: 15px; background: #252525; border-left: 5px solid var(--primary-color); display: none; border-radius: 4px; font-size: 0.95em; }
    .stats-bar { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 20px; color: var(--text-muted); border-bottom: 1px solid #333; padding-bottom: 10px; }

    .scoreboard { text-align: center; align-items: center; }
    .score-circle { width: 150px; height: 150px; border-radius: 50%; border: 8px solid var(--primary-color); display: flex; justify-content: center; align-items: center; font-size: 2em; font-weight: bold; margin: 20px auto; }
</style>
</head>
<body>

<div class="container">
    <h1>SPI Reviewer: Modules 4 and 5</h1>

    <div class="tabs" id="module-tabs">
        <button class="active" data-m="4" onclick="selectModule(4)">Module 4: Cybersecurity</button>
        <button data-m="5" onclick="selectModule(5)">Module 5: Risk &amp; Responsibility</button>
    </div>

    <div class="modes" id="mode-tabs">
        <button class="active" onclick="selectMode('flashcard')">Flashcard Mode</button>
        <button onclick="selectMode('quiz')">Quiz Mode</button>
    </div>

    <!-- Flashcard View -->
    <div id="flashcard-view" class="card-container">
        <div class="stats-bar">
            <span id="fc-progress">Card 1 / 48</span>
            <span>Click card to flip</span>
        </div>
        <div class="flashcard-wrapper" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="face front">
                    <div class="fc-question" id="fc-q">Question text</div>
                </div>
                <div class="face back">
                    <div class="fc-answer" id="fc-a">Answer text</div>
                    <div class="fc-explanation" id="fc-e">Explanation text</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button onclick="prevCard()">&#8592; Previous</button>
            <button onclick="nextCard()">Next &#8594;</button>
        </div>
    </div>

    <!-- Quiz View -->
    <div id="quiz-view" class="quiz-container hidden">
        <div class="stats-bar">
            <span id="qz-progress">Question 1 / 48</span>
            <span id="qz-score">Score: 0 / 48 | 0%</span>
        </div>
        <div class="quiz-question" id="qz-q">Question text</div>
        <div class="options" id="qz-options"></div>
        <div class="explanation-box" id="qz-e"></div>
        <div class="controls">
            <button id="qz-next" class="hidden" onclick="nextQuiz()">Next Question &#8594;</button>
        </div>
    </div>

    <!-- Scoreboard View -->
    <div id="scoreboard-view" class="scoreboard hidden">
        <h2>Module Completed!</h2>
        <div class="score-circle" id="sb-score">0%</div>
        <h3 id="sb-text">Great job!</h3>
        <button onclick="restartQuiz()" style="margin-top: 20px;">Restart Quiz</button>
    </div>
</div>

<script>
    // --- QUESTION DATABASE (80 Questions: 48 for Module 4, 32 for Module 5) ---
    // m = module, q = question, o = options (array of 4), a = correct option index (0-3), e = explanation
    const db = [
        // MODULE 4 (48 Questions)
        {m:4, q:"An activity done using computers and the internet to steal identities or spread malicious programs is called:", o:["Cybersecurity","Cybercrime","Cyberespionage","Cyberterrorism"], a:1, e:"Cybercrime is an activity done using computers and the internet, such as stealing a person's identity or spreading malicious programs."},
        {m:4, q:"The technologies and processes designed to protect computers, networks and data from unauthorized access and attacks are called:", o:["Cybercrime","Hacktivism","Cybersecurity","Phishing"], a:2, e:"Cybersecurity protects computers, networks and data from unauthorized access and attacks delivered via the internet by cybercriminals."},
        {m:4, q:"Which is an example of using \"the computer as a target\"?", o:["Credit card fraud","Hacking and DoS attacks","Selling stolen goods online","Online blackmail"], a:1, e:"Computer as a target means using a computer to attack other computers (hacking, virus/worm attacks, DoS attacks)."},
        {m:4, q:"Which describes \"the computer as a weapon\"?", o:["Using a computer to commit a real-world crime such as credit card fraud","Hacking another computer","Launching a DoS attack","Spreading a worm"], a:0, e:"Computer as a weapon means using a computer to commit a real-world crime, e.g., credit card fraud."},
        {m:4, q:"BYOD is a business policy that permits employees to:", o:["Back up their own data","Bring their own device","Build their own defenses","Block outside devices"], a:1, e:"Bring Your Own Device (BYOD) permits, and sometimes encourages, employees to use their own mobile devices."},
        {m:4, q:"In computing, an exploit is:", o:["A fix issued by developers","A program that scans for viruses","A policy permitting personal devices","An attack that takes advantage of a system vulnerability"], a:3, e:"An exploit is an attack on an information system that takes advantage of a system vulnerability, often due to poor design or implementation."},
        {m:4, q:"Software developers issue what to eliminate a discovered vulnerability?", o:["A patch","A payload","A signature","A proxy"], a:0, e:"Once a vulnerability is discovered, developers create and issue a fix, or patch."},
        {m:4, q:"The old stereotype of a computer troublemaker was:", o:["A government-sponsored team","A criminal syndicate","An introverted \"geek\" working alone for notoriety","A disgruntled employee"], a:2, e:"Previously the stereotype was an introverted geek working alone, motivated by the desire for some notoriety."},
        {m:4, q:"Who is hired by an organization to test the security of its information systems?", o:["Black hat hacker","Cracker","White hat hacker","Hacktivist"], a:2, e:"A white hat hacker is hired to test security, in contrast to a black hat hacker who violates security maliciously or for illegal personal gain."},
        {m:4, q:"Which individual causes problems, steals data and corrupts systems?", o:["Cracker","White hat hacker","Industrial spy","Hacktivist"], a:0, e:"A cracker is an individual who causes problems, steals data and corrupts systems."},
        {m:4, q:"An employee or contractor who tries to gain financially or disrupt a company's systems is a:", o:["Industrial spy","Malicious insider","Cyberterrorist","Hacktivist"], a:1, e:"A malicious insider is an employee or contractor who attempts to gain financially and/or disrupt a company's information systems and operations."},
        {m:4, q:"Who captures trade secrets to gain an unfair competitive advantage?", o:["Cybercriminal","Cracker","Malicious insider","Industrial spy"], a:3, e:"An industrial spy captures trade secrets and attempts to gain an unfair competitive advantage."},
        {m:4, q:"Who hacks computers or websites to promote a political ideology?", o:["Hacktivist","Cracker","Cybercriminal","Industrial spy"], a:0, e:"A hacktivist hacks computers or websites in an attempt to promote a political ideology."},
        {m:4, q:"Who attempts to destroy the infrastructure of governments, financial institutions, utilities and emergency response units?", o:["Hacktivist","Black hat hacker","Cyberterrorist","Malicious insider"], a:2, e:"A cyberterrorist attempts to destroy infrastructure components of governments, financial institutions, corporations, utilities and emergency response units."},
        {m:4, q:"Someone who attacks a computer system or network for financial gain is a:", o:["Hacktivist","Cybercriminal","Cyberterrorist","White hat hacker"], a:1, e:"A cybercriminal attacks a computer system or network for financial gain."},
        {m:4, q:"Malware that stops you from using your computer or data until you meet certain demands, such as paying a fee, is:", o:["A worm","A Trojan horse","A virus","Ransomware"], a:3, e:"Ransomware blocks access to your computer or data until demands, such as paying a ransom, are met."},
        {m:4, q:"A piece of code, usually disguised as something else, that makes a computer behave in an unexpected and undesirable way is a:", o:["Worm","Ransomware","Virus","Blended threat"], a:2, e:"A virus is programming code, usually disguised as something else, that causes unexpected and usually undesirable behavior."},
        {m:4, q:"Which harmful program resides in the active memory of a computer and duplicates itself?", o:["Worm","Virus","Trojan horse","Ransomware"], a:0, e:"A worm is a harmful program that resides in active memory and duplicates itself."},
        {m:4, q:"A seemingly harmless program with malicious code hidden inside is a:", o:["Worm","Trojan horse","Blended threat","Ransomware"], a:1, e:"A Trojan horse looks harmless but hides malicious code."},
        {m:4, q:"A sophisticated threat that combines features of a virus, worm, Trojan horse and other malicious code in a single payload is a:", o:["Phishing attack","Spam","Cyberespionage","Blended threat"], a:3, e:"A blended threat combines the features of a virus, worm, Trojan horse and other malicious code into a single payload."},
        {m:4, q:"The use of email systems to send unsolicited email to large numbers of people is:", o:["Phishing","Smishing","Email spam","Vishing"], a:2, e:"Email spam is unsolicited email sent to large numbers of people."},
        {m:4, q:"The CAN-SPAM Act states that:", o:["It is legal to spam provided messages meet a few basic requirements","All spam is banned","Only text-message spam is allowed","Only governments may send spam"], a:0, e:"CAN-SPAM (Controlling the Assault of Non-Solicited Pornography and Marketing) makes spam legal if messages meet a few basic requirements."},
        {m:4, q:"CAPTCHA software generates and grades tests that:", o:["All computer programs can pass","Humans can pass but all but the most sophisticated programs cannot","Only experts can pass","Only computers can pass"], a:1, e:"CAPTCHA stands for Completely Automated Public Turing Test to Tell Computers and Humans Apart."},
        {m:4, q:"Fraudulently using email to get the recipient to reveal personal data is called:", o:["Smishing","Vishing","Spear phishing","Phishing"], a:3, e:"Phishing is the act of fraudulently using email to get the recipient to reveal personal data."},
        {m:4, q:"Phishing aimed at a certain organization's employees is:", o:["Spear phishing","Smishing","Vishing","Cyberespionage"], a:0, e:"Spear phishing sends fraudulent emails to a certain organization's employees."},
        {m:4, q:"A variation of phishing that uses texting is:", o:["Vishing","Spear phishing","Smishing","Spam"], a:2, e:"Smishing is phishing through text messages (SMS)."},
        {m:4, q:"Victims receive a voice-mail telling them to call a number or visit a website. This is:", o:["Smishing","Vishing","Phishing","Spam"], a:1, e:"Vishing is like smishing, except that victims receive a voice-mail message."},
        {m:4, q:"Malware that secretly steals data from government agencies, military contractors and manufacturers is used in:", o:["Cyberterrorism","Ransomware","Spam","Cyberespionage"], a:3, e:"Cyberespionage deploys malware that secretly steals data in the systems of organizations such as government agencies and military contractors."},
        {m:4, q:"Intimidating a government or civilian population by using IT to disable critical national infrastructure is:", o:["Cyberterrorism","Cyberespionage","Hacktivism","Phishing"], a:0, e:"Cyberterrorism is the intimidation of government or civilians by using IT to disable critical national infrastructure."},
        {m:4, q:"Which Philippine agency is primarily responsible for safeguarding national sovereignty, territorial integrity, and peace and security, and oversees the AFP?", o:["DHS","PNP","DND","DICT"], a:2, e:"The Philippine Department of National Defense (DND) oversees the AFP and is key in disaster response, counterterrorism and national security. (DHS is the US Department of Homeland Security.)"},
        {m:4, q:"Which type of cybersecurity protects data by location, classification and monitoring of information at rest, in use and in motion?", o:["IAM","DLP","IDS","NGFW"], a:1, e:"Data Loss Prevention (DLP) focuses on the location, classification and monitoring of information at rest, in use and in motion."},
        {m:4, q:"Which uses authentication services to limit and track employee access to internal systems?", o:["DLP","Cloud security","Network security","IAM"], a:3, e:"Identity and Access Management (IAM) uses authentication services to limit and track employee access."},
        {m:4, q:"The process of encoding data to make it unintelligible, often used during data transfer, is:", o:["Antivirus scanning","Firewalling","Encryption","Proxying"], a:2, e:"Encryption encodes data so it is unreadable, and is often used in transit to prevent theft."},
        {m:4, q:"Which systems work to identify potentially hostile cyber activity?", o:["IDS/IPS","DLP","IAM","Cloud security"], a:0, e:"Intrusion Detection Systems (IDS) and Intrusion Prevention Systems (IPS) identify potentially hostile cyber activity."},
        {m:4, q:"Which CIA element ensures only individuals with proper authority can access sensitive data?", o:["Integrity","Confidentiality","Availability","Authentication"], a:1, e:"Confidentiality: only those with the proper authority can access sensitive data."},
        {m:4, q:"Which CIA element ensures data can be changed only by authorized individuals, guaranteeing accuracy and trustworthiness?", o:["Confidentiality","Availability","Authorization","Integrity"], a:3, e:"Integrity guarantees the accuracy, consistency and trustworthiness of data."},
        {m:4, q:"Which CIA element ensures data can be accessed when and where needed, including during disaster recovery?", o:["Availability","Integrity","Confidentiality","Accountability"], a:0, e:"Availability: data accessible when and where needed, in normal and disaster recovery operations."},
        {m:4, q:"Creating an organization's security strategy typically begins with:", o:["Buying a firewall","Firing staff","Performing a risk assessment","Writing an audit report"], a:2, e:"A strategy typically begins with a risk assessment to identify and prioritize the threats the organization faces."},
        {m:4, q:"A security policy:", o:["Gives step-by-step technical instructions","Is the same as a procedure guideline","Is purely technical","Outlines what needs to be done but not how to do it"], a:3, e:"A policy says what must be done; the how is in separate documents and procedure guidelines."},
        {m:4, q:"What evaluates whether an organization has a well-considered security policy and whether it is being followed?", o:["Risk assessment","Security audit","Security dashboard","Disaster recovery plan"], a:1, e:"A security audit checks that a policy exists and is followed, and reviews who has access and at what level of authority."},
        {m:4, q:"A firewall is:", o:["An antivirus program","A backup system","A system of software, hardware or both that stands guard between the internal network and the Internet","A type of proxy server"], a:2, e:"A firewall limits network access based on the organization's access policy. It is the most common security precaution of businesses."},
        {m:4, q:"A next-generation firewall (NGFW):", o:["Filters network traffic based on packet contents to block sophisticated attacks","Only blocks ports","Is software only","Replaces antivirus"], a:0, e:"An NGFW is hardware- or software-based and detects and blocks sophisticated attacks by filtering traffic based on packet contents."},
        {m:4, q:"Symmetric encryption algorithms:", o:["Use two different keys","Use no key","Use public and private keys","Use the same key for encryption and decryption"], a:3, e:"Symmetric uses the same key both ways; asymmetric uses one key to encrypt and a different key to decrypt."},
        {m:4, q:"In two-factor authentication, a fingerprint is \"something you\":", o:["Know","Are","Have","Share"], a:1, e:"Know = PIN or password. Have = card or token. Are = biometric such as a fingerprint or retina scan."},
        {m:4, q:"A virus signature is:", o:["A digital signature on a document","A username","A specific sequence of bytes indicating the presence of a specific virus","A patch's file name"], a:2, e:"Antivirus software scans for a specific sequence of bytes, known as a virus signature, that indicates a specific virus."},
        {m:4, q:"Before eradication begins, the IT security group must:", o:["Collect and log possible criminal evidence and verify that backups are current, complete and malware-free","Delete all logs","Reboot every server","Notify the public"], a:0, e:"Eradication comes after evidence is collected and logged and backups are verified as current, complete and free of malware."},
        {m:4, q:"A disaster recovery plan is:", o:["An estimate of threats","A list of passwords","A schedule of audits","A documented process for recovering hardware, software, data, networks and facilities after a disaster"], a:3, e:"A disaster recovery plan supports availability by documenting how to recover business information system assets after a disaster."},
        {m:4, q:"The purpose of a security dashboard is to:", o:["Replace the firewall","Reduce the effort required to monitor and identify threats in time to act","Encrypt data","Train employees"], a:1, e:"A dashboard displays key indicators (threats, exposures, policy compliance, incident alerts) so threats are spotted in time to act."},

        // MODULE 5 (32 Questions)
        {m:5, q:"Computer liability refers to:", o:["The speed at which a computer processes data","A hardware warranty","The legal responsibility for the consequences of actions or negligence in using, designing, developing or managing computer systems","The cost of buying software"], a:2, e:"Computer liability arises when harm, loss or damage is caused by computer-related errors, misuse or failures."},
        {m:5, q:"Computer liability is rooted in all of the following EXCEPT:", o:["Increased sales revenue","Negligence","Breach of contract","Fraud"], a:0, e:"Its legal and ethical basis is negligence, breach of contract, fraud, or failure to comply with data protection and cybersecurity laws."},
        {m:5, q:"Computer liability may apply to:", o:["Only software developers","Only end-users","Only employers","Multiple parties, including developers, IT companies, employers and end-users"], a:3, e:"It applies to multiple parties depending on the situation."},
        {m:5, q:"Hardware failure is usually due to:", o:["Coding errors","Physical deterioration","User misuse","Poor requirements"], a:1, e:"Hardware failure is usually due to physical deterioration."},
        {m:5, q:"The correct order of the phases of the bathtub curve is:", o:["Wear-out, useful life, burn-in","Useful life, burn-in, wear-out","Burn-in, useful life, wear-out","Burn-in, wear-out, useful life"], a:2, e:"Failure rate falls during burn-in, stays low in useful life, then rises in wear-out."},
        {m:5, q:"During the useful life phase of the bathtub curve, the failure rate is:", o:["Roughly constant and low","Rising sharply","Zero","At its highest"], a:0, e:"Hardware reliability tends toward a constant value, shown as a flat low failure rate."},
        {m:5, q:"Which is NOT one of the four general ways of measuring failures against time?", o:["Time of failure","Interval between failures","Cumulative failures up to a given time","Number of users affected"], a:3, e:"The four are: time of failure, interval between failures, cumulative failures up to a given time, and failures in a time interval."},
        {m:5, q:"Which statement about hardware reliability is true?", o:["It is always zero","It tends, more than software, toward a constant value","It is unaffected by environment","Hardware faults are never design faults"], a:1, e:"Environment is important, and a proportion of hardware faults are design faults."},
        {m:5, q:"Environmental conditions such as time, place and medium are which barrier to digital communication?", o:["Physical","Emotional","Semantic","Credibility"], a:0, e:"Physical barriers include environmental conditions like time, place and medium."},
        {m:5, q:"Digital messages lack tone of voice, facial expression and body language, so they are easily misinterpreted. This is which barrier?", o:["Physical","Identity","Emotional","Accessibility"], a:2, e:"Emotional barriers: beliefs, attitudes and values shape how people process information, and digital messages lack emotional cues."},
        {m:5, q:"The same emoji looks different on Apple, Google and Samsung phones and conveys a different emotion. This is which barrier?", o:["Physical","Attention","Credibility","Semantic"], a:3, e:"Semantic barriers are different interpretations of the words and symbols used to communicate."},
        {m:5, q:"Videos and podcasts that people with disabilities cannot use are an example of which barrier?", o:["Semantic","Accessibility","Identity","Attention"], a:1, e:"Digital communication is effective only when people of all abilities can access and understand the information."},
        {m:5, q:"People missing a message because they are distracted or overloaded with information is which barrier?", o:["Attention","Physical","Credibility","Emotional"], a:0, e:"Attention barriers: people are distracted or fatigued by information overload."},
        {m:5, q:"When people cannot trust the message, the messenger, or both, which barrier is at work?", o:["Physical","Emotional","Credibility","Semantic"], a:2, e:"Credibility barriers interfere when people can't trust the message, the messenger, or both."},
        {m:5, q:"Which barrier leads to miscommunication and misrepresentation of people and their ideas?", o:["Physical","Attention","Semantic","Identity"], a:3, e:"Identity barriers can lead to miscommunications, misunderstandings and misrepresentation of people and their ideas."},
        {m:5, q:"Which is NOT a simple way to keep files safe?", o:["Regularly back up your files","Share your password with everyone","Control access to your files","Encrypt your hard drive"], a:1, e:"The simple ways: back up, use an external hard drive, store files in the cloud, control access, and encrypt your hard drive."},
        {m:5, q:"In recent critical-system failures, the source of failure is more often:", o:["Physical hardware faults","Natural disasters","System design or end-user operation and interaction","Power outages"], a:2, e:"Failure is more rarely in hardware and more frequently in system design or end-user operation/interaction (software)."},
        {m:5, q:"Failures of critical systems are becoming:", o:["Increasingly distributed and often nationwide","Strictly local","Rarer","Limited to hardware"], a:0, e:"Failures are increasingly distributed and often nationwide, e.g., credit card denial of authorization."},
        {m:5, q:"Solid software requirements are:", o:["Vague and flexible","Clear, complete, detailed, cohesive, attainable, testable and agreed to by all players","Decided by the developer alone","Written after coding"], a:1, e:"Solid requirements are clear, complete, detailed, cohesive, attainable, testable and agreed to by all players."},
        {m:5, q:"Adequate testing means:", o:["Testing only at the end","Skipping re-testing","Testing only by end users","Starting early, re-testing after fixes or changes, and planning enough time"], a:3, e:"Start testing early, re-test after fixes or changes, and plan adequate time for testing and bug-fixing."},
        {m:5, q:"A realistic schedule allows adequate time for:", o:["Planning, design, testing, bug fixing, re-testing, changes and documentation","Coding only","Deployment only","None of these"], a:0, e:"Realistic schedules cover planning, design, testing, bug fixing, re-testing, changes and documentation."},
        {m:5, q:"Good communication in software development includes:", o:["Avoiding walkthroughs","Email only","Walkthroughs, inspections, groupware, wikis and bug-tracking tools","Working in isolation"], a:2, e:"Require walkthroughs and inspections; use groupware, wikis, bug-tracking and change management tools, and intranet capabilities."},
        {m:5, q:"A professional, unlike a salesclerk, should try to meet:", o:["The customer's desires","The client's needs, consistent with the welfare of the client and the public","The employer's profit goals","Whatever is requested"], a:1, e:"Professionals have clients, not customers, and meet needs rather than desires."},
        {m:5, q:"The Therac-25 radiation treatment machine was manufactured by:", o:["NASA","IBM","Siemens","Atomic Energy of Canada Limited"], a:3, e:"AECL built the Therac-25 in the early 1980s; it relied on computer software to control its operation."},
        {m:5, q:"Between 1985 and 1987, the Therac-25 caused:", o:["One death","Two deaths","Three deaths and serious injuries to three others","Ten deaths"], a:2, e:"Three patients died and three others were seriously injured."},
        {m:5, q:"In the Therac-25 case, the proximate cause of each accident (causal responsibility) was:", o:["The operator who started the treatment","The manufacturer","The patient","The hospital administrator"], a:0, e:"Causal responsibility is attributed to causes; here the proximate cause was the operator who started the radiation treatment."},
        {m:5, q:"A foreman is responsible for disposing of toxic waste even if a forklift operator moves the drums. This is which responsibility?", o:["Causal","Role","Legal","Moral"], a:1, e:"Role responsibility belongs to the person assigned a task or function."},
        {m:5, q:"An organization that can be liable for damages in a civil lawsuit carries which responsibility?", o:["Causal","Role","Moral","Legal"], a:3, e:"Legal responsibility: an individual could be charged with a crime, or an organization could be liable for damages in a civil lawsuit."},
        {m:5, q:"The kind of respect professionals should show one another is called:", o:["Collegiality","Customer service","Competition","Deference"], a:0, e:"When professionals interact with each other, they should demonstrate collegiality."},
        {m:5, q:"The evaluation of a professional's work by other members of the same profession is:", o:["An audit","Certification","Peer review","Marketing"], a:2, e:"Because clients can't adequately judge professional service, peers evaluate the work, in both practice and research."},
        {m:5, q:"According to engineering codes of ethics, an engineer's most important obligation is:", o:["Maximizing profit","Ensuring the safety, health and welfare of the public","Loyalty to the employer","Speed of delivery"], a:1, e:"Computing professionals share this special obligation and should also improve the quality of life of those who use computers and information systems."},
        {m:5, q:"The responsibility to educate the public is:", o:["An individual duty only","The government's duty","The client's duty","A collective responsibility of the computing profession as a whole"], a:3, e:"Individual professionals may fulfill it in their own ways, e.g., advising a church on equipment or writing to a newspaper about internet legislation."}
    ];

    let currentModule = 4;
    let currentMode = 'flashcard'; // 'flashcard' or 'quiz'
    let currentData = [];
    let currentIndex = 0;

    // Quiz State
    let quizScore = 0;
    let quizAnswered = false;

    // Elements
    const fcQ = document.getElementById('fc-q');
    const fcA = document.getElementById('fc-a');
    const fcE = document.getElementById('fc-e');
    const fcProgress = document.getElementById('fc-progress');
    const flashcard = document.getElementById('flashcard');

    const qzQ = document.getElementById('qz-q');
    const qzOptions = document.getElementById('qz-options');
    const qzE = document.getElementById('qz-e');
    const qzNextBtn = document.getElementById('qz-next');
    const qzProgress = document.getElementById('qz-progress');
    const qzScoreText = document.getElementById('qz-score');

    function init() {
        loadData();
    }

    function loadData() {
        currentData = db.filter(item => item.m === currentModule);
        currentIndex = 0;
        quizScore = 0;

        if(currentMode === 'flashcard') {
            document.getElementById('flashcard-view').classList.remove('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('scoreboard-view').classList.add('hidden');
            renderFlashcard();
        } else {
            document.getElementById('flashcard-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            document.getElementById('scoreboard-view').classList.add('hidden');
            renderQuiz();
        }
    }

    function selectModule(m) {
        currentModule = m;
        document.querySelectorAll('#module-tabs button').forEach((btn) => {
            btn.classList.toggle('active', Number(btn.dataset.m) === m);
        });
        loadData();
    }

    function selectMode(mode) {
        currentMode = mode;
        document.querySelectorAll('#mode-tabs button').forEach((btn) => {
            btn.classList.toggle('active', btn.innerText.toLowerCase().includes(mode));
        });
        loadData();
    }

    // --- FLASHCARD LOGIC ---
    function renderFlashcard() {
        flashcard.classList.remove('flip');
        const item = currentData[currentIndex];
        fcQ.innerText = item.q;
        fcA.innerText = item.o[item.a];
        fcE.innerText = item.e;
        fcProgress.innerText = `Card ${currentIndex + 1} / ${currentData.length}`;
    }

    function flipCard() {
        flashcard.classList.toggle('flip');
    }

    function prevCard() {
        if(currentIndex > 0) {
            currentIndex--;
            renderFlashcard();
        }
    }

    function nextCard() {
        if(currentIndex < currentData.length - 1) {
            currentIndex++;
            renderFlashcard();
        }
    }

    // --- QUIZ LOGIC ---
    function renderQuiz() {
        if(currentIndex >= currentData.length) {
            showScoreboard();
            return;
        }

        quizAnswered = false;
        qzE.style.display = 'none';
        qzNextBtn.classList.add('hidden');

        const item = currentData[currentIndex];
        qzQ.innerText = item.q;
        qzProgress.innerText = `Question ${currentIndex + 1} / ${currentData.length}`;
        qzScoreText.innerText = `Score: ${quizScore} / ${currentData.length} | ${Math.round((quizScore/(currentData.length||1))*100)}%`;

        qzOptions.innerHTML = '';
        item.o.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => selectQuizAnswer(idx, btn);
            qzOptions.appendChild(btn);
        });
    }

    function selectQuizAnswer(selectedIndex, btnElement) {
        if(quizAnswered) return;
        quizAnswered = true;

        const item = currentData[currentIndex];
        const optionsDivs = qzOptions.children;

        for(let i=0; i<optionsDivs.length; i++) {
            optionsDivs[i].classList.add('disabled');
            if(i === item.a) {
                optionsDivs[i].classList.add('correct');
            }
        }

        if(selectedIndex === item.a) {
            quizScore++;
        } else {
            btnElement.classList.add('wrong');
        }

        qzE.innerText = item.e;
        qzE.style.display = 'block';
        qzNextBtn.classList.remove('hidden');
        qzScoreText.innerText = `Score: ${quizScore} / ${currentData.length} | ${Math.round((quizScore/(currentData.length||1))*100)}%`;
    }

    function nextQuiz() {
        currentIndex++;
        renderQuiz();
    }

    function showScoreboard() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('scoreboard-view').classList.remove('hidden');

        const percentage = Math.round((quizScore / currentData.length) * 100);
        document.getElementById('sb-score').innerText = `${percentage}%`;

        let msg = "";
        if(percentage >= 90) msg = "Outstanding Mastery!";
        else if(percentage >= 75) msg = "Good Job!";
        else msg = "Keep Reviewing!";

        document.getElementById('sb-text').innerText = `${quizScore} out of ${currentData.length} correct. ${msg}`;
    }

    function restartQuiz() {
        currentIndex = 0;
        quizScore = 0;
        document.getElementById('scoreboard-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        renderQuiz();
    }

    // Initialize app
    init();
</script>
</body>
</html>
